<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Система контроля ЭЦП</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1e2b3c 0%, #0f1a26 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 15px;
    }
    .dashboard {
      width: 100%;
      max-width: 1600px;
      min-width: 1000px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .logo-placeholder {
      width: 2cm;
      height: 2cm;
      min-width: 2cm;
      min-height: 2cm;
      background: rgba(255,255,255,0.15);
      border: 2px dashed rgba(255,255,255,0.4);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 10px;
      text-align: center;
      transition: 0.2s;
      background-size: cover;
      background-position: center;
    }
    .title {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 700;
      color: white;
      letter-spacing: 1px;
      text-shadow: 0 4px 12px black;
      flex: 1;
    }
    .user-block {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      border-radius: 30px;
      color: #ccc;
    }
    select, input, button {
      outline: none;
    }
    .user-block select {
      background: #2c3e50;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 20px;
      font-weight: 500;
    }
    .user-block input {
      background: #2c3e50;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      color: white;
      width: 120px;
    }
    .btn {
      background: #2980b9;
      border: none;
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn:hover { background: #3498db; }
    .btn-logout { background: #7f8c8d; }
    .btn-logout:hover { background: #95a5a6; }
    .btn-delete {
      background: #c0392b;
      margin-left: 5px;
    }
    .btn-delete:hover { background: #e74c3c; }
    .row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .card {
      background: rgba(20, 30, 40, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      flex: 1 1 calc(25% - 15px);
      min-width: 200px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.25s;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(0,160,255,0.3);
      border-color: rgba(255,255,255,0.3);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .card-title {
      font-weight: 600;
      font-size: 1rem;
      opacity: 0.9;
    }
    .badge {
      font-weight: 800;
      font-size: 1.4rem;
      color: #f1c40f;
      text-shadow: 0 0 8px black;
    }
    .indicators {
      display: flex;
      gap: 6px;
      margin-top: auto;
      flex-wrap: wrap;
    }
    .indicator {
      flex: 1;
      min-width: 50px;
      background: #2c3e50;
      border-radius: 10px;
      padding: 5px;
      text-align: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: white;
      transition: background 0.3s;
    }
    .indicator.green { background: #27ae60; }
    .indicator.red {
      background: #e74c3c;
      animation: pulse-red 1s infinite;
    }
    @keyframes pulse-red {
      0% { box-shadow: 0 0 5px #e74c3c; }
      50% { box-shadow: 0 0 20px #e74c3c; }
      100% { box-shadow: 0 0 5px #e74c3c; }
    }
    .full-width-card {
      flex: 1 1 100%;
      background: rgba(20, 30, 40, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 16px;
      color: white;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.2s;
      text-align: center;
    }
    .full-width-card:hover { background: rgba(30, 40, 55, 0.8); }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #1e2b3c;
      border-radius: 24px;
      padding: 20px;
      width: 90%;
      max-width: 1200px;
      max-height: 85vh;
      overflow-y: auto;
      color: white;
      box-shadow: 0 30px 60px black;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 1.4rem;
      font-weight: bold;
    }
    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
    }
    th { background: #2c3e50; padding: 8px; text-align: left; }
    td, th { border: 1px solid #34495e; padding: 6px; }
    input[type="text"], input[type="date"], select {
      background: #2c3e50;
      color: white;
      border: 1px solid #5d6d7e;
      padding: 4px 8px;
      border-radius: 5px;
      width: 100%;
      box-sizing: border-box;
    }
    .search-box { margin-bottom: 10px; display: flex; gap: 10px; }
    .search-box input { flex: 1; }
    .actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
    .hidden { display: none; }
    @media (max-width: 1100px) {
      .card { flex: 1 1 calc(50% - 15px); }
    }
  </style>
</head>
<body>
<div class="dashboard" id="dashboardApp">
  <div class="header">
    <!-- Вставьте путь к вашему логотипу: style="background-image: url('logo.png');" -->
    <div class="logo-placeholder" id="logoBox" title="Логотип (2x2 см)">📷<br>лого</div>
    <div class="title">Система контроля электронных-цифровых подписей</div>
    <div class="user-block" id="authBlock">
      <select id="loginSelect">
        <option value="">-- выберите логин --</option>
      </select>
      <input type="password" id="passwordInput" placeholder="Пароль">
      <button class="btn" id="loginBtn">Войти</button>
      <button class="btn btn-logout hidden" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div id="rowsContainer"></div>

  <div class="full-width-card" id="uninstalledCard">
    <strong>⚠️ ЭЦП, не установленные на ПК (сводно)</strong><br>
    <span id="uninstalledCount">0</span> записей без отметки "Установлена"
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <span id="modalTitle">Реестр</span>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  (function() {
    // ---------- Список логинов (без паролей) ----------
    const LOGINS = ["Красилова Н.", "Прохоров А.", "Полякова Е."];

    // Загружаемые из localStorage пароли
    let userPasswords = {};

    // Основные данные
    let currentUser = null;
    let dataStore = {
      fk: [],
      kontur: [],
      sbis: []
    };
    let changeLog = [];

    // Загрузка из localStorage
    function loadFromStorage() {
      // Данные
      const savedData = localStorage.getItem('ecp_dashboard_data');
      if (savedData) {
        try {
          const parsed = JSON.parse(savedData);
          if (parsed.fk && parsed.kontur && parsed.sbis) dataStore = parsed;
        } catch(e){}
      }
      // Логи
      const logSaved = localStorage.getItem('ecp_dashboard_log');
      if (logSaved) {
        try { changeLog = JSON.parse(logSaved); } catch(e){}
      }
      // Пароли
      const savedPass = localStorage.getItem('ecp_passwords');
      if (savedPass) {
        try { userPasswords = JSON.parse(savedPass); } catch(e){}
      }
      // Сессия
      const savedUser = localStorage.getItem('ecp_current_user');
      if (savedUser && LOGINS.includes(savedUser)) {
        currentUser = savedUser;
      }
    }

    function saveToStorage() {
      localStorage.setItem('ecp_dashboard_data', JSON.stringify(dataStore));
      localStorage.setItem('ecp_dashboard_log', JSON.stringify(changeLog));
    }

    function savePasswordsToStorage() {
      localStorage.setItem('ecp_passwords', JSON.stringify(userPasswords));
    }

    function logAction(action, details) {
      const entry = {
        user: currentUser || 'неизвестный',
        datetime: new Date().toLocaleString(),
        action: action,
        details: details
      };
      changeLog.push(entry);
      saveToStorage();
    }

    function getDaysLeft(endDateStr) {
      if (!endDateStr) return null;
      const end = new Date(endDateStr);
      const today = new Date(); today.setHours(0,0,0,0);
      return Math.ceil((end.getTime() - today.getTime()) / (1000*60*60*24));
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function computeTypeStats(records, type) {
      const filtered = records.filter(r => r.type === type);
      let valid = 0, warn7 = 0, warn1 = 0;
      filtered.forEach(r => {
        const days = getDaysLeft(r.dateEnd);
        if (days === null) return;
        if (days > 7) valid++;
        else if (days > 1) warn7++;
        else warn1++;
      });
      return { valid, warn7, warn1, total: filtered.length };
    }

    const rowsContainer = document.getElementById('rowsContainer');
    const uninstalledCard = document.getElementById('uninstalledCard');
    const uninstalledCountSpan = document.getElementById('uninstalledCount');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const closeModalBtn = document.getElementById('closeModalBtn');

    const providerConfig = [
      { key: 'fk', label: 'ФК' },
      { key: 'kontur', label: 'КОНТУР' },
      { key: 'sbis', label: 'СБИС' }
    ];

    // Заполнение выпадающего списка логинов
    function populateLoginSelect() {
      const select = document.getElementById('loginSelect');
      select.innerHTML = '<option value="">-- выберите логин --</option>';
      LOGINS.forEach(login => {
        const opt = document.createElement('option');
        opt.value = login;
        opt.textContent = login;
        select.appendChild(opt);
      });
    }

    function renderDashboard() {
      if (!currentUser) {
        rowsContainer.innerHTML = '<div style="color:white; padding:20px;">Пожалуйста, войдите в систему</div>';
        return;
      }
      let html = '';
      providerConfig.forEach(prov => {
        const records = dataStore[prov.key] || [];
        const statsR = computeTypeStats(records, 'Р');
        const statsRD = computeTypeStats(records, 'РД');
        const statsS = computeTypeStats(records, 'С');

        html += `<div class="row">`;
        html += `
          <div class="card" data-action="openRegistry" data-provider="${prov.key}">
            <div class="card-header">
              <span class="card-title">Сводный реестр ЭЦП</span>
              <span class="badge">${prov.label}</span>
            </div>
            <div style="font-size:0.8rem; opacity:0.7;">Внести данные</div>
            <div style="margin-top:5px; font-weight:bold;">Записей: ${records.length}</div>
          </div>
        `;
        html += renderTypeCard(prov.key, 'Р', 'Руководство', statsR);
        html += renderTypeCard(prov.key, 'РД', 'Руководство департаментов', statsRD);
        html += renderTypeCard(prov.key, 'С', 'Сотрудники МК', statsS);
        html += `</div>`;
      });

      rowsContainer.innerHTML = html;
      updateUninstalledCount();

      document.querySelectorAll('.card[data-action="openRegistry"]').forEach(card => {
        card.addEventListener('click', () => openRegistryEditor(card.dataset.provider));
      });
      document.querySelectorAll('.card[data-action="openTypeList"]').forEach(card => {
        card.addEventListener('click', () => openFilteredList(card.dataset.provider, card.dataset.type));
      });

      uninstalledCard.onclick = () => openUninstalledList();
    }

    function renderTypeCard(provider, type, title, stats) {
      const days7Class = stats.warn7 > 0 ? 'red' : 'green';
      const days1Class = stats.warn1 > 0 ? 'red' : 'green';
      return `
        <div class="card" data-action="openTypeList" data-provider="${provider}" data-type="${type}">
          <div class="card-title">Реестр ЭЦП (${title})</div>
          <div class="indicators">
            <div class="indicator green">Действует ${stats.valid}</div>
            <div class="indicator ${days7Class}">Ост. 7 дн ${stats.warn7}</div>
            <div class="indicator ${days1Class}">Ост. 1 дн ${stats.warn1}</div>
          </div>
        </div>
      `;
    }

    function updateUninstalledCount() {
      let total = 0;
      Object.values(dataStore).forEach(arr => arr.forEach(r => { if (!r.installed) total++; }));
      uninstalledCountSpan.textContent = total;
    }

    function openModal(title, contentHtml) {
      modalTitle.textContent = title;
      modalBody.innerHTML = contentHtml;
      modal.classList.add('active');
      closeModalBtn.onclick = () => modal.classList.remove('active');
    }

    window.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    function openRegistryEditor(provider) {
      const records = dataStore[provider] || [];
      const provLabel = providerConfig.find(p=>p.key===provider).label;

      let html = `
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Поиск по таблице...">
        </div>
        <table id="registryTable">
          <thead><tr>
            <th>Номер</th><th>ФИО</th><th>Дата выпуска</th><th>Дата окончания</th>
            <th>Тип ЭЦП</th><th>Номер сотрудника</th><th>Номер кабинета</th>
            <th>Действует дней</th><th>Установлена</th><th>Действия</th>
          </tr></thead>
          <tbody></tbody>
        </table>
        <div class="actions">
          <button class="btn" id="addRecordBtn">Создать новую запись</button>
        </div>
      `;

      openModal(`Сводный реестр ЭЦП (${provLabel})`, html);

      const tbody = document.querySelector('#registryTable tbody');
      const searchInput = document.getElementById('searchInput');

      function renderTable(filterText = '') {
        const filtered = records.filter(r => {
          if (!filterText) return true;
          const s = filterText.toLowerCase();
          return Object.values(r).some(v => String(v).toLowerCase().includes(s));
        });
        tbody.innerHTML = filtered.map(r => {
          const days = getDaysLeft(r.dateEnd);
          return `
            <tr data-id="${r.id}">
              <td>${r.number || ''}</td>
              <td contenteditable="false">${r.fio || ''}</td>
              <td><input type="date" value="${r.dateStart || ''}" disabled></td>
              <td><input type="date" value="${r.dateEnd || ''}" disabled></td>
              <td>
                <select disabled>
                  <option ${r.type==='Р'?'selected':''}>Р</option>
                  <option ${r.type==='РД'?'selected':''}>РД</option>
                  <option ${r.type==='С'?'selected':''}>С</option>
                </select>
              </td>
              <td contenteditable="false">${r.empNumber || ''}</td>
              <td contenteditable="false">${r.room || ''}</td>
              <td>${days !== null ? days : '—'}</td>
              <td><input type="checkbox" ${r.installed ? 'checked' : ''} disabled></td>
              <td>
                <button class="btn editBtn">Изменить</button>
                <button class="btn saveBtn hidden">Сохранить</button>
                <button class="btn btn-delete deleteBtn">Удалить</button>
              </td>
            </tr>
          `;
        }).join('');

        // Обработчики кнопок
        tbody.querySelectorAll('.editBtn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const row = e.target.closest('tr');
            enterEditMode(row);
          });
        });
        tbody.querySelectorAll('.saveBtn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const row = e.target.closest('tr');
            saveRow(row, provider);
          });
        });
        tbody.querySelectorAll('.deleteBtn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const row = e.target.closest('tr');
            const id = row.dataset.id;
            if (confirm('Удалить запись?')) {
              const idx = records.findIndex(r => r.id === id);
              if (idx !== -1) {
                records.splice(idx, 1);
                logAction('delete_record', `Провайдер ${provider}, id ${id}`);
                saveToStorage();
                renderTable(searchInput.value);
                renderDashboard(); // обновить индикаторы
              }
            }
          });
        });
      }

      function enterEditMode(row) {
        row.querySelectorAll('[contenteditable="false"]').forEach(cell => {
          cell.contentEditable = 'true';
          cell.style.background = '#34495e';
        });
        row.querySelectorAll('input, select').forEach(el => el.disabled = false);
        row.querySelector('.editBtn').classList.add('hidden');
        row.querySelector('.saveBtn').classList.remove('hidden');
      }

      function saveRow(row, provider) {
        const id = row.dataset.id;
        const cells = row.querySelectorAll('td');
        const number = cells[0].textContent.trim();
        const fio = cells[1].textContent.trim();
        const dateStart = row.querySelector('input[type="date"]:nth-of-type(1)').value;
        const dateEnd = row.querySelector('input[type="date"]:nth-of-type(2)').value;
        const typeSelect = row.querySelector('select');
        const type = typeSelect.value;
        const empNumber = cells[5].textContent.trim();
        const room = cells[6].textContent.trim();
        const installed = row.querySelector('input[type="checkbox"]').checked;

        const record = records.find(r => r.id === id);
        if (record) {
          Object.assign(record, { number, fio, dateStart, dateEnd, type, empNumber, room, installed });
          logAction('update_record', `Провайдер ${provider}, id ${id}`);
        }
        saveToStorage();
        renderTable(searchInput.value);
        renderDashboard(); // обновить индикаторы
      }

      document.getElementById('addRecordBtn').addEventListener('click', () => {
        const newRec = {
          id: generateId(),
          number: '', fio: '', dateStart: '', dateEnd: '', type: 'Р',
          empNumber: '', room: '', installed: false
        };
        records.push(newRec);
        logAction('add_record', `Провайдер ${provider}, новая запись`);
        saveToStorage();
        renderTable(searchInput.value);
        renderDashboard();
      });

      searchInput.addEventListener('input', () => renderTable(searchInput.value));
      renderTable();
    }

    function openFilteredList(provider, type) {
      const records = dataStore[provider] || [];
      const filtered = records.filter(r => r.type === type);
      const provLabel = providerConfig.find(p=>p.key===provider).label;
      const typeNames = { 'Р':'Руководство', 'РД':'Руководство департаментов', 'С':'Сотрудники МК' };
      let html = `<table><thead><tr><th>Номер</th><th>ФИО</th><th>Дата окончания</th><th>Действует дней</th><th>Установлена</th></tr></thead><tbody>`;
      filtered.forEach(r => {
        const days = getDaysLeft(r.dateEnd);
        html += `<tr><td>${r.number||''}</td><td>${r.fio||''}</td><td>${r.dateEnd||''}</td><td>${days!==null?days:'—'}</td><td>${r.installed?'✅':'❌'}</td></tr>`;
      });
      html += `</tbody></table>`;
      openModal(`Реестр ЭЦП (${typeNames[type]}) - ${provLabel}`, html);
    }

    function openUninstalledList() {
      let all = [];
      Object.entries(dataStore).forEach(([provider, records]) => {
        records.forEach(r => { if (!r.installed) all.push({...r, provider}); });
      });
      let html = `<table><thead><tr><th>Провайдер</th><th>Номер</th><th>ФИО</th><th>Дата окончания</th><th>Тип</th><th>Установлена</th><th>Действие</th></tr></thead><tbody>`;
      all.forEach(r => {
        html += `<tr data-id="${r.id}" data-provider="${r.provider}">
          <td>${r.provider}</td><td>${r.number}</td><td>${r.fio}</td><td>${r.dateEnd}</td><td>${r.type}</td>
          <td><input type="checkbox" class="installCheckbox"></td>
          <td><button class="btn saveInstallBtn">Сохранить</button></td>
        </tr>`;
      });
      html += `</tbody></table>`;
      openModal('ЭЦП без установки на ПК', html);

      document.querySelectorAll('.saveInstallBtn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const row = e.target.closest('tr');
          const id = row.dataset.id;
          const provider = row.dataset.provider;
          const checked = row.querySelector('.installCheckbox').checked;
          const rec = dataStore[provider].find(r => r.id === id);
          if (rec) {
            rec.installed = checked;
            logAction('install_toggle', `Провайдер ${provider}, id ${id}, установлена=${checked}`);
            saveToStorage();
            renderDashboard();
            modal.classList.remove('active');
          }
        });
      });
    }

    // ---------- Первичная настройка паролей ----------
    function isPasswordsSet() {
      return LOGINS.every(login => userPasswords[login] && userPasswords[login].length > 0);
    }

    function showSetupModal() {
      let html = '<h3>Первичная настройка паролей</h3><p>Задайте пароль для каждого логина:</p>';
      LOGINS.forEach(login => {
        html += `
          <div style="margin:10px 0;">
            <label>${login}</label>
            <input type="password" id="setup_${login.replace(/\s/g,'')}" placeholder="Пароль" style="width:250px;">
          </div>`;
      });
      html += '<button class="btn" id="saveSetupBtn">Сохранить пароли</button>';
      openModal('Настройка доступа', html);
      document.getElementById('saveSetupBtn').addEventListener('click', () => {
        let valid = true;
        const newPass = {};
        LOGINS.forEach(login => {
          const input = document.getElementById('setup_' + login.replace(/\s/g,''));
          if (!input.value.trim()) valid = false;
          newPass[login] = input.value.trim();
        });
        if (!valid) {
          alert('Все пароли должны быть заполнены');
          return;
        }
        userPasswords = newPass;
        savePasswordsToStorage();
        modal.classList.remove('active');
        document.getElementById('loginBtn').disabled = false;
      });
    }

    // ---------- Авторизация ----------
    const loginSelect = document.getElementById('loginSelect');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    function updateAuthUI() {
      if (currentUser) {
        loginSelect.disabled = true;
        passwordInput.disabled = true;
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
        document.querySelector('.user-block').style.background = '#27ae60';
      } else {
        loginSelect.disabled = false;
        passwordInput.disabled = false;
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        document.querySelector('.user-block').style.background = 'rgba(0,0,0,0.4)';
        if (!isPasswordsSet()) {
          loginBtn.disabled = true;
        } else {
          loginBtn.disabled = false;
        }
      }
    }

    loginBtn.addEventListener('click', () => {
      const login = loginSelect.value;
      const pass = passwordInput.value;
      if (!login) return alert('Выберите логин');
      if (!userPasswords[login]) return alert('Пароль для данного логина не задан.');
      if (userPasswords[login] === pass) {
        currentUser = login;
        localStorage.setItem('ecp_current_user', login);
        logAction('login', `Пользователь ${login} вошел`);
        updateAuthUI();
        renderDashboard();
        passwordInput.value = '';
      } else {
        alert('Неверный пароль');
      }
    });

    logoutBtn.addEventListener('click', () => {
      logAction('logout', `Пользователь ${currentUser} вышел`);
      currentUser = null;
      localStorage.removeItem('ecp_current_user');
      updateAuthUI();
      renderDashboard();
      rowsContainer.innerHTML = '<div style="color:white; padding:20px;">Войдите для просмотра дашборда</div>';
    });

    // ---------- Инициализация ----------
    populateLoginSelect();
    loadFromStorage();
    updateAuthUI();
    if (!isPasswordsSet()) {
      showSetupModal();
    } else {
      loginBtn.disabled = false;
    }
    if (currentUser) {
      renderDashboard();
    } else {
      rowsContainer.innerHTML = '<div style="color:white; padding:20px;">Пожалуйста, войдите в систему</div>';
    }

    setInterval(() => {
      if (currentUser) renderDashboard();
    }, 60000);
  })();
</script>
</body>
</html>
