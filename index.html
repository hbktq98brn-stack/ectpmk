<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Система контроля ЭЦП</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    body { background: linear-gradient(135deg,#1e2b3c 0%,#0f1a26 100%); min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:15px; }
    .dashboard { width:100%; max-width:1600px; min-width:1000px; background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); border-radius:28px; padding:20px; box-shadow:0 30px 50px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; gap:20px; }
    .header { display:flex; align-items:center; gap:20px; margin-bottom:5px; flex-wrap:wrap; }
    .logo-placeholder { width:2cm; height:2cm; min-width:2cm; min-height:2cm; background:rgba(255,255,255,0.15); border:2px dashed rgba(255,255,255,0.4); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-size:10px; text-align:center; background-size:cover; background-position:center; }
    .title { font-size:clamp(1.6rem,3vw,2.4rem); font-weight:700; color:white; letter-spacing:1px; text-shadow:0 4px 12px black; flex:1; }
    .user-block { display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.4); padding:8px 16px; border-radius:30px; color:#ccc; }
    select, input, button { outline:none; }
    .user-block select { background:#2c3e50; color:white; border:none; padding:6px 10px; border-radius:20px; font-weight:500; }
    .user-block input { background:#2c3e50; border:none; padding:6px 12px; border-radius:20px; color:white; width:120px; }
    .btn { background:#2980b9; border:none; color:white; padding:6px 16px; border-radius:20px; cursor:pointer; font-weight:600; transition:0.2s; }
    .btn:hover { background:#3498db; }
    .btn-logout { background:#7f8c8d; }
    .btn-logout:hover { background:#95a5a6; }
    .btn-delete { background:#c0392b; margin-left:5px; }
    .btn-delete:hover { background:#e74c3c; }
    .row { display:flex; gap:15px; flex-wrap:wrap; }
    .card { background:rgba(20,30,40,0.7); backdrop-filter:blur(8px); border-radius:20px; padding:16px; box-shadow:0 8px 20px rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.08); flex:1 1 calc(25% - 15px); min-width:200px; display:flex; flex-direction:column; cursor:pointer; transition:all 0.25s; color:white; position:relative; overflow:hidden; }
    .card:hover { transform:translateY(-3px); box-shadow:0 15px 30px rgba(0,160,255,0.3); border-color:rgba(255,255,255,0.3); }
    .card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
    .card-title { font-weight:600; font-size:1rem; opacity:0.9; }
    .badge { font-weight:800; font-size:1.4rem; color:#f1c40f; text-shadow:0 0 8px black; }
    .indicators { display:flex; gap:6px; margin-top:auto; flex-wrap:wrap; }
    .indicator { flex:1; min-width:50px; background:#2c3e50; border-radius:10px; padding:5px; text-align:center; font-size:0.7rem; font-weight:bold; color:white; transition:background 0.3s; }
    .indicator.green { background:#27ae60; }
    .indicator.red { background:#e74c3c; animation:pulse-red 1s infinite; }
    @keyframes pulse-red { 0%{box-shadow:0 0 5px #e74c3c;} 50%{box-shadow:0 0 20px #e74c3c;} 100%{box-shadow:0 0 5px #e74c3c;} }
    .full-width-card { flex:1 1 100%; background:rgba(20,30,40,0.7); backdrop-filter:blur(8px); border-radius:20px; padding:16px; color:white; cursor:pointer; border:1px solid rgba(255,255,255,0.1); transition:0.2s; text-align:center; }
    .full-width-card:hover { background:rgba(30,40,55,0.8); }
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter:blur(6px); justify-content:center; align-items:center; z-index:1000; }
    .modal.active { display:flex; }
    .modal-content { background:#1e2b3c; border-radius:24px; padding:20px; width:90%; max-width:1200px; max-height:85vh; overflow-y:auto; color:white; box-shadow:0 30px 60px black; }
    .modal-header { display:flex; justify-content:space-between; margin-bottom:15px; font-size:1.4rem; font-weight:bold; }
    .close-btn { background:none; border:none; color:white; font-size:2rem; cursor:pointer; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:0.85rem; }
    th { background:#2c3e50; padding:8px; text-align:left; }
    td, th { border:1px solid #34495e; padding:6px; }
    input[type="text"], input[type="date"], select { background:#2c3e50; color:white; border:1px solid #5d6d7e; padding:4px 8px; border-radius:5px; width:100%; box-sizing:border-box; }
    .search-box { margin-bottom:10px; display:flex; gap:10px; }
    .search-box input { flex:1; }
    .actions { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
    .hidden { display:none; }
    .number-cell { text-align:center; font-weight:bold; background:#1e2b3c; user-select:none; }
    .sync-status { position:fixed; bottom:10px; left:10px; background:#2c3e50; color:white; padding:4px 12px; border-radius:20px; font-size:0.8rem; }
    @media (max-width:1100px) { .card { flex:1 1 calc(50% - 15px); } }
  </style>
</head>
<body>
<div class="dashboard" id="dashboardApp">
  <div class="header">
    <!-- ВСТАВЬТЕ ПУТЬ К ЛОГОТИПУ: style="background-image: url('logo.png');" -->
 <div class="logo-placeholder" id="logoBox" title="Логотип">
  <img src="ECE4C31C-030A-4981-A95A-FD126D3BA6A2.webp" alt="Логотип" style="width:100%; height:100%; object-fit:cover;">
</div>
    <div class="title">Система контроля электронных-цифровых подписей</div>
    <div class="user-block" id="authBlock">
      <select id="loginSelect">
        <option value="">-- выберите логин --</option>
      </select>
      <input type="password" id="passwordInput" placeholder="Пароль">
      <button class="btn" id="loginBtn">Войти</button>
      <button class="btn btn-logout hidden" id="logoutBtn">Выйти</button>
    </div>
  </div>
  <div id="rowsContainer"></div>
  <div class="full-width-card" id="uninstalledCard">
    <strong>⚠️ ЭЦП, не установленные на ПК (сводно)</strong><br>
    <span id="uninstalledCount">0</span> записей без отметки "Установлена"
  </div>
  <div style="margin-top:10px; display:flex; gap:10px; justify-content:flex-end;">
    <button class="btn" id="exportBtn">📤 Экспорт данных</button>
    <button class="btn" id="importBtn">📥 Импорт данных</button>
    <input type="file" id="importFile" accept=".json" class="hidden">
  </div>
  <div class="sync-status" id="syncStatus">💾 Локально</div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <span id="modalTitle">Реестр</span>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  (function() {
    // ---------- НАСТРОЙКИ ----------
    const LOGINS = ["Красилова Н.", "Прохоров А.", "Полякова Е."];
    const STORAGE_DATA = 'ecp_dashboard_data';
    const STORAGE_PASS = 'ecp_passwords';
    const STORAGE_USER = 'ecp_current_user';

    // Firebase
    let db = null;
    try {
      const firebaseConfig = {
        apiKey: "AIzaSyBTb941B1JkHnSPrp5LQlHpYrV7QlAC5qc",
        authDomain: "ecpmkr-b2c2d.firebaseapp.com",
        projectId: "ecpmkr-b2c2d",
        storageBucket: "ecpmkr-b2c2d.firebasestorage.app",
        messagingSenderId: "371575817517",
        appId: "1:371575817517:web:dd72d69b4662c33c173fa4",
        measurementId: "G-0QB7BQ14G6"
      };
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      console.log('✅ Firebase инициализирована');
    } catch (e) {
      console.warn('Firebase недоступна, работаем локально');
    }

    // ---------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ----------
    let currentUser = null;
    let dataStore = { fk: [], kontur: [], sbis: [] };
    let userPasswords = {};

    // ---------- ХРАНЕНИЕ ДАННЫХ РЕЕСТРОВ ----------
    function loadLocalData() {
      const raw = localStorage.getItem(STORAGE_DATA);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.fk && parsed.kontur && parsed.sbis) {
            dataStore = parsed;
            return true;
          }
        } catch(e) {}
      }
      return false;
    }
    function saveLocalData() {
      localStorage.setItem(STORAGE_DATA, JSON.stringify(dataStore));
      console.log('💾 Локально сохранено');
    }
    function saveCloudData() {
      if (!db) return;
      db.collection("ecp_data").doc("registries").set(dataStore)
        .then(() => console.log('☁️ Облако обновлено'))
        .catch(e => console.error('Ошибка облака:', e));
    }
    function fullSave() {
      saveLocalData();
      saveCloudData();
      document.getElementById('syncStatus').textContent = db ? '✅ Синхронизировано' : '💾 Локально';
    }

    // ---------- ПАРОЛИ (ОБЛАКО + ЛОКАЛЬНО) ----------
    function loadPasswordsFromCloud() {
      if (!db) return Promise.resolve(false);
      return db.collection("ecp_data").doc("passwords").get()
        .then(doc => {
          if (doc.exists) {
            const cloudPass = doc.data().passwords;
            if (cloudPass && typeof cloudPass === 'object') {
              userPasswords = cloudPass;
              // Обновляем локальную копию
              localStorage.setItem(STORAGE_PASS, JSON.stringify(userPasswords));
              console.log('🔑 Пароли загружены из облака');
              return true;
            }
          }
          return false;
        })
        .catch(e => {
          console.error('Ошибка загрузки паролей из облака:', e);
          return false;
        });
    }

    function savePasswordsToCloud() {
      if (!db) return;
      db.collection("ecp_data").doc("passwords").set({ passwords: userPasswords })
        .then(() => console.log('🔑 Пароли сохранены в облако'))
        .catch(e => console.error('Ошибка сохранения паролей в облако:', e));
    }

    function loadPasswordsFromLocal() {
      const raw = localStorage.getItem(STORAGE_PASS);
      if (raw) {
        try {
          userPasswords = JSON.parse(raw);
          return true;
        } catch(e) {}
      }
      return false;
    }

    function savePasswordsToLocal() {
      localStorage.setItem(STORAGE_PASS, JSON.stringify(userPasswords));
    }

    // Сохраняем пароли и локально, и в облако
    function savePasswords() {
      savePasswordsToLocal();
      savePasswordsToCloud();
    }

    // ---------- СЕССИЯ ----------
    function loadSession() {
      const saved = localStorage.getItem(STORAGE_USER);
      if (saved && LOGINS.includes(saved)) currentUser = saved;
    }
    function saveSession() {
      if (currentUser) localStorage.setItem(STORAGE_USER, currentUser);
      else localStorage.removeItem(STORAGE_USER);
    }

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    async function init() {
      loadSession();

      // Заполняем список логинов
      const select = document.getElementById('loginSelect');
      select.innerHTML = '<option value="">-- выберите логин --</option>';
      LOGINS.forEach(login => {
        const opt = document.createElement('option');
        opt.value = login;
        opt.textContent = login;
        select.appendChild(opt);
      });

      // Загружаем пароли: сначала облако, потом локально
      const cloudOk = await loadPasswordsFromCloud();
      if (!cloudOk) {
        loadPasswordsFromLocal();
      }

      // Загружаем данные реестров (аналогично)
      let dataLoaded = false;
      if (db) {
        try {
          const doc = await db.collection("ecp_data").doc("registries").get();
          if (doc.exists) {
            const cloudData = doc.data();
            if (cloudData && Array.isArray(cloudData.fk) && Array.isArray(cloudData.kontur) && Array.isArray(cloudData.sbis)) {
              dataStore = cloudData;
              console.log('☁️ Данные реестров загружены из облака');
              saveLocalData();
              dataLoaded = true;
            }
          }
        } catch (e) {
          console.error('Ошибка загрузки данных реестров:', e);
        }
      }
      if (!dataLoaded) {
        loadLocalData();
      }

      // Подписка на изменения (реального времени)
      if (db) {
        db.collection("ecp_data").doc("registries").onSnapshot(doc => {
          if (doc.exists) {
            const cloudData = doc.data();
            if (cloudData && cloudData.fk && cloudData.kontur && cloudData.sbis) {
              if (JSON.stringify(dataStore) !== JSON.stringify(cloudData)) {
                dataStore = cloudData;
                saveLocalData();
                if (currentUser) renderDashboard();
              }
            }
          }
        });
        // Подписка на изменения паролей (чтобы подхватывать смену с других браузеров)
        db.collection("ecp_data").doc("passwords").onSnapshot(doc => {
          if (doc.exists) {
            const newPass = doc.data().passwords;
            if (newPass && JSON.stringify(userPasswords) !== JSON.stringify(newPass)) {
              userPasswords = newPass;
              savePasswordsToLocal();
              console.log('🔄 Пароли обновлены из облака');
              // Если мы на экране входа, обновим UI
              if (!currentUser) updateAuthUI();
            }
          }
        });
      }

      updateAuthUI();
      if (!isPasswordsSet()) {
        showSetupModal();
      }

      if (currentUser) {
        renderDashboard();
      } else {
        document.getElementById('rowsContainer').innerHTML = '<div style="color:white; padding:20px;">Пожалуйста, войдите в систему</div>';
      }
    }

    function isPasswordsSet() {
      return LOGINS.every(login => userPasswords[login] && userPasswords[login].length > 0);
    }

    // ---------- DOM ----------
    const loginSelect = document.getElementById('loginSelect');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const rowsContainer = document.getElementById('rowsContainer');
    const uninstalledCard = document.getElementById('uninstalledCard');
    const uninstalledCountSpan = document.getElementById('uninstalledCount');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const providers = [
      { key: 'fk', label: 'ФК' },
      { key: 'kontur', label: 'КОНТУР' },
      { key: 'sbis', label: 'СБИС' }
    ];

    // ---------- ОТРИСОВКА ДАШБОРДА ----------
    function renderDashboard() {
      if (!currentUser) return;
      let html = '';
      providers.forEach(prov => {
        const records = dataStore[prov.key] || [];
        const statsR = calcStats(records, 'Р');
        const statsRD = calcStats(records, 'РД');
        const statsS = calcStats(records, 'С');
        html += `<div class="row">`;
        html += `
          <div class="card" data-action="openRegistry" data-provider="${prov.key}">
            <div class="card-header"><span class="card-title">Сводный реестр ЭЦП</span><span class="badge">${prov.label}</span></div>
            <div style="font-size:0.8rem;opacity:0.7;">Внести данные</div>
            <div style="margin-top:5px;font-weight:bold;">Записей: ${records.length}</div>
          </div>
        `;
        html += typeCard(prov.key, 'Р', 'Руководство', statsR);
        html += typeCard(prov.key, 'РД', 'Руководство департаментов', statsRD);
        html += typeCard(prov.key, 'С', 'Сотрудники МК', statsS);
        html += `</div>`;
      });
      rowsContainer.innerHTML = html;
      updateUninstalledCount();

      document.querySelectorAll('.card[data-action="openRegistry"]').forEach(c => {
        c.addEventListener('click', () => openRegistryEditor(c.dataset.provider));
      });
      document.querySelectorAll('.card[data-action="openTypeList"]').forEach(c => {
        c.addEventListener('click', () => openFilteredList(c.dataset.provider, c.dataset.type));
      });
      uninstalledCard.onclick = () => openUninstalledList();
    }

    function calcStats(records, type) {
      const filtered = records.filter(r => r.type === type);
      let valid = 0, warn7 = 0, warn1 = 0;
      filtered.forEach(r => {
        const days = getDaysLeft(r.dateEnd);
        if (days === null) return;
        if (days > 7) valid++;
        else if (days > 1) warn7++;
        else warn1++;
      });
      return {valid, warn7, warn1, total: filtered.length};
    }

    function typeCard(provider, type, title, stats) {
      const c7 = stats.warn7 > 0 ? 'red' : 'green';
      const c1 = stats.warn1 > 0 ? 'red' : 'green';
      return `
        <div class="card" data-action="openTypeList" data-provider="${provider}" data-type="${type}">
          <div class="card-title">Реестр ЭЦП (${title})</div>
          <div class="indicators">
            <div class="indicator green">Действует ${stats.valid}</div>
            <div class="indicator ${c7}">Ост. 7 дн ${stats.warn7}</div>
            <div class="indicator ${c1}">Ост. 1 дн ${stats.warn1}</div>
          </div>
        </div>
      `;
    }

    function updateUninstalledCount() {
      let total = 0;
      for (let p in dataStore) dataStore[p].forEach(r => { if (!r.installed) total++; });
      uninstalledCountSpan.textContent = total;
    }

    // ---------- МОДАЛЬНЫЕ ОКНА ----------
    function openModal(title, content) {
      modalTitle.textContent = title;
      modalBody.innerHTML = content;
      modal.classList.add('active');
      closeModalBtn.onclick = () => modal.classList.remove('active');
    }
    window.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('active'); });

    function getDaysLeft(date) {
      if (!date) return null;
      const end = new Date(date);
      const now = new Date(); now.setHours(0,0,0,0);
      return Math.ceil((end - now) / 86400000);
    }
    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
    function getNextNumber(prov) {
      const arr = dataStore[prov] || [];
      return arr.length ? Math.max(...arr.map(r => parseInt(r.number) || 0)) + 1 : 1;
    }

    // ========== РЕДАКТОР СВОДНОГО РЕЕСТРА ==========
    function openRegistryEditor(provider) {
      const records = dataStore[provider] || [];
      const provLabel = providers.find(p => p.key === provider).label;

      let html = `
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Поиск...">
        </div>
        <table id="registryTable">
          <thead><tr>
            <th>Номер</th><th>ФИО</th><th>Дата выпуска</th><th>Дата окончания</th>
            <th>Тип ЭЦП</th><th>Номер сотрудника</th><th>Номер кабинета</th>
            <th>Действует дней</th><th>Установлена</th><th>Действия</th>
          </tr></thead>
          <tbody></tbody>
        </table>
        <div class="actions">
          <button class="btn" id="addRecordBtn">Создать новую запись</button>
        </div>
      `;
      openModal(`Сводный реестр ЭЦП (${provLabel})`, html);

      const tbody = document.querySelector('#registryTable tbody');
      const searchInput = document.getElementById('searchInput');

      function renderTable(filter = '') {
        const filtered = records.filter(r => {
          if (!filter) return true;
          const s = filter.toLowerCase();
          return Object.values(r).some(v => String(v).toLowerCase().includes(s));
        });
        tbody.innerHTML = filtered.map(r => {
          const days = getDaysLeft(r.dateEnd);
          return `
            <tr data-id="${r.id}">
              <td class="number-cell">${r.number || ''}</td>
              <td contenteditable="false">${r.fio || ''}</td>
              <td><input type="date" value="${r.dateStart || ''}" disabled></td>
              <td><input type="date" value="${r.dateEnd || ''}" disabled></td>
              <td>
                <select disabled>
                  <option ${r.type==='Р'?'selected':''}>Р</option>
                  <option ${r.type==='РД'?'selected':''}>РД</option>
                  <option ${r.type==='С'?'selected':''}>С</option>
                </select>
              </td>
              <td contenteditable="false">${r.empNumber || ''}</td>
              <td contenteditable="false">${r.room || ''}</td>
              <td>${days !== null ? days : '—'}</td>
              <td><input type="checkbox" ${r.installed ? 'checked' : ''} disabled></td>
              <td>
                <button class="btn editBtn" onclick="window._editRow(this)">Изменить</button>
                <button class="btn saveBtn hidden" onclick="window._saveRow(this, '${provider}')">Сохранить</button>
                <button class="btn btn-delete deleteBtn" onclick="window._deleteRow(this, '${provider}')">Удалить</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      window._editRow = function(btn) {
        const row = btn.closest('tr');
        if (!row) return;
        row.querySelectorAll('td[contenteditable="false"]:not(.number-cell)').forEach(cell => {
          cell.contentEditable = 'true';
          cell.style.background = '#34495e';
        });
        row.querySelectorAll('input, select').forEach(el => el.disabled = false);
        row.querySelector('.editBtn').classList.add('hidden');
        row.querySelector('.saveBtn').classList.remove('hidden');
      };

      window._saveRow = function(btn, prov) {
        const row = btn.closest('tr');
        if (!row) return;
        const id = row.dataset.id;
        const dateStartInput = row.querySelector('td:nth-child(3) input[type="date"]');
        const dateEndInput   = row.querySelector('td:nth-child(4) input[type="date"]');
        const typeSelect     = row.querySelector('td:nth-child(5) select');
        const installCheck   = row.querySelector('td:nth-child(9) input[type="checkbox"]');

        if (!dateStartInput || !dateEndInput || !typeSelect || !installCheck) {
          console.error('Не найдены поля');
          return;
        }

        const cells = row.querySelectorAll('td');
        const number = cells[0].textContent.trim();
        const fio = cells[1].textContent.trim();
        const dateStart = dateStartInput.value;
        const dateEnd = dateEndInput.value;
        const type = typeSelect.value;
        const empNumber = cells[5].textContent.trim();
        const room = cells[6].textContent.trim();
        const installed = installCheck.checked;

        const record = records.find(r => r.id === id);
        if (record) {
          Object.assign(record, { number, fio, dateStart, dateEnd, type, empNumber, room, installed });
          fullSave();
        }
        if (searchInput) searchInput.value = '';
        renderTable('');
        renderDashboard();
      };

      window._deleteRow = function(btn, prov) {
        const row = btn.closest('tr');
        if (!row) return;
        const id = row.dataset.id;
        if (confirm('Удалить запись?')) {
          const idx = records.findIndex(r => r.id === id);
          if (idx !== -1) {
            records.splice(idx, 1);
            fullSave();
            if (searchInput) searchInput.value = '';
            renderTable('');
            renderDashboard();
          }
        }
      };

      document.getElementById('addRecordBtn').addEventListener('click', () => {
        const newRec = {
          id: generateId(),
          number: getNextNumber(provider),
          fio: '',
          dateStart: '',
          dateEnd: '',
          type: 'Р',
          empNumber: '',
          room: '',
          installed: false
        };
        records.push(newRec);
        fullSave();
        if (searchInput) searchInput.value = '';
        renderTable('');
        renderDashboard();
      });

      if (searchInput) {
        searchInput.addEventListener('input', () => renderTable(searchInput.value));
      }
      renderTable('');
    }

    // ---------- ПРОСМОТР ПО ТИПАМ ----------
    function openFilteredList(provider, type) {
      const records = dataStore[provider] || [];
      const filtered = records.filter(r => r.type === type);
      const label = providers.find(p => p.key === provider).label;
      const names = {'Р':'Руководство','РД':'Руководство департаментов','С':'Сотрудники МК'};
      let html = `<table><thead><tr><th>Номер</th><th>ФИО</th><th>Дата окончания</th><th>Действует дней</th><th>Установлена</th></tr></thead><tbody>`;
      filtered.forEach(r => {
        const days = getDaysLeft(r.dateEnd);
        html += `<tr><td>${r.number||''}</td><td>${r.fio||''}</td><td>${r.dateEnd||''}</td><td>${days!==null?days:'—'}</td><td>${r.installed?'✅':'❌'}</td></tr>`;
      });
      html += `</tbody></table>`;
      openModal(`Реестр ЭЦП (${names[type]}) - ${label}`, html);
    }

    // ---------- НЕУСТАНОВЛЕННЫЕ ----------
    function openUninstalledList() {
      let all = [];
      for (let p in dataStore) {
        dataStore[p].forEach(r => { if (!r.installed) all.push({...r, provider: p}); });
      }
      let html = `<table><thead><tr><th>Провайдер</th><th>Номер</th><th>ФИО</th><th>Дата окончания</th><th>Тип</th><th>Установлена</th><th>Действие</th></tr></thead><tbody>`;
      all.forEach(r => {
        html += `<tr data-id="${r.id}" data-provider="${r.provider}">
          <td>${r.provider}</td><td>${r.number}</td><td>${r.fio}</td><td>${r.dateEnd}</td><td>${r.type}</td>
          <td><input type="checkbox" class="installCheckbox"></td>
          <td><button class="btn saveInstallBtn">Сохранить</button></td>
        </tr>`;
      });
      html += `</tbody></table>`;
      openModal('ЭЦП без установки на ПК', html);
      document.querySelectorAll('.saveInstallBtn').forEach(btn => {
        btn.onclick = function() {
          const row = this.closest('tr');
          const id = row.dataset.id;
          const prov = row.dataset.provider;
          const checked = row.querySelector('.installCheckbox').checked;
          const rec = dataStore[prov].find(r => r.id === id);
          if (rec) {
            rec.installed = checked;
            fullSave();
            renderDashboard();
            modal.classList.remove('active');
          }
        };
      });
    }

    // ---------- ЭКСПОРТ/ИМПОРТ ----------
    document.getElementById('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(dataStore, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ecp_backup.json';
      a.click();
    };
    document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (imported.fk && imported.kontur && imported.sbis) {
            if (confirm('Заменить текущие данные?')) {
              dataStore = imported;
              fullSave();
              if (currentUser) renderDashboard();
            }
          } else alert('Неверный формат');
        } catch(ex) { alert('Ошибка файла'); }
      };
      reader.readAsText(file);
    };

    // ---------- АВТОРИЗАЦИЯ ----------
    function showSetupModal() {
      let html = '<h3>Первичная настройка паролей</h3><p>Задайте пароль для каждого пользователя:</p>';
      LOGINS.forEach(login => {
        html += `<div style="margin:10px 0;"><label>${login}</label> <input type="password" id="setup_${login.replace(/\s/g,'')}" placeholder="Пароль" style="width:250px;"></div>`;
      });
      html += '<button class="btn" id="saveSetupBtn">Сохранить пароли</button>';
      openModal('Настройка доступа', html);
      document.getElementById('saveSetupBtn').onclick = () => {
        let ok = true;
        const newPass = {};
        LOGINS.forEach(login => {
          const input = document.getElementById('setup_' + login.replace(/\s/g,''));
          if (!input.value.trim()) ok = false;
          newPass[login] = input.value.trim();
        });
        if (!ok) { alert('Заполните все поля'); return; }
        userPasswords = newPass;
        savePasswords(); // сохранит и локально, и в облако
        modal.classList.remove('active');
        updateAuthUI();
      };
    }

    function updateAuthUI() {
      if (currentUser) {
        loginSelect.disabled = true;
        passwordInput.disabled = true;
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
        document.querySelector('.user-block').style.background = '#27ae60';
      } else {
        loginSelect.disabled = false;
        passwordInput.disabled = false;
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        document.querySelector('.user-block').style.background = 'rgba(0,0,0,0.4)';
        loginBtn.disabled = !isPasswordsSet();
        if (!isPasswordsSet()) {
          if (!modal.classList.contains('active')) showSetupModal();
        }
      }
    }

    loginBtn.addEventListener('click', () => {
      const login = loginSelect.value;
      const pass = passwordInput.value;
      if (!login) return alert('Выберите логин');
      if (!userPasswords[login]) return alert('Пароль не задан');
      if (userPasswords[login] === pass) {
        currentUser = login;
        saveSession();
        updateAuthUI();
        renderDashboard();
        passwordInput.value = '';
      } else alert('Неверный пароль');
    });

    logoutBtn.addEventListener('click', () => {
      currentUser = null;
      saveSession();
      updateAuthUI();
      rowsContainer.innerHTML = '<div style="color:white; padding:20px;">Войдите для просмотра</div>';
    });

    // Запуск
    init();
    setInterval(() => { if (currentUser) renderDashboard(); }, 60000);
  })();
</script>
</body>
</html>
